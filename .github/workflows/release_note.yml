name: release-please

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}

    steps:

      # ============================================================
      # STEP 1
      # Run Release Please.
      #
      # This creates/updates the Release Please PR.
      # ============================================================
      - name: Run Release Please - Create Release PR
        id: rp_pr
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ env.GH_TOKEN }}
          target-branch: main
          skip-github-pull-request: false
          skip-github-release: false
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # ============================================================
      # STEP 2
      # Debug Release Please outputs
      # ============================================================
      - name: Debug Release Please outputs
        run: |
          echo "========================================"
          echo "Release Please outputs"
          echo "========================================"
          echo "releases_created = ${{ steps.rp_pr.outputs.releases_created }}"
          echo "paths_released   = ${{ steps.rp_pr.outputs.paths_released }}"
          echo "tag_name         = ${{ steps.rp_pr.outputs.tag_name }}"
          echo "release_created  = ${{ steps.rp_pr.outputs.release_created }}"
          echo "prs_created      = ${{ steps.rp_pr.outputs.prs_created }}"
          echo "========================================"

      # ============================================================
      # STEP 3
      # Wait for GitHub to make the newly created Release Please PR
      # and its labels visible through the API.
      # ============================================================
      - name: Wait for Release Please PR synchronization
        if: ${{ steps.rp_pr.outputs.prs_created == 'true' }}
        run: |
          echo "Release Please reported that a PR was created."
          echo "Waiting 30 seconds for GitHub API synchronization..."
          sleep 30

      # ============================================================
      # STEP 4
      # Find ONLY the Release Please PR.
      #
      # IMPORTANT:
      #
      # We intentionally DO NOT search for generic:
      #   - title containing "release"
      #   - branch containing "release"
      #
      # We require:
      #
      #   1. PR is OPEN
      #   2. PR targets main
      #   3. PR has "autorelease: pending" label
      #   4. PR head branch starts with "release-please"
      #
      # If these conditions are not met, NOTHING is merged.
      # ============================================================
      - name: Find Release Please PR
        id: find_pr
        if: ${{ steps.rp_pr.outputs.prs_created == 'true' }}
        run: |
          set -e

          echo "========================================"
          echo "Searching ONLY for Release Please PR"
          echo "========================================"

          PR_NUMBER=""

          MAX_ATTEMPTS=24
          ATTEMPT=1

          while [ "${ATTEMPT}" -le "${MAX_ATTEMPTS}" ]; do

            echo ""
            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS}"
            echo "Checking GitHub..."

            # --------------------------------------------------------
            # Get OPEN PRs targeting main with the official
            # Release Please label.
            # --------------------------------------------------------
            RELEASE_PRS=$(gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --state open \
              --label "autorelease: pending" \
              --json number,title,headRefName,baseRefName,labels \
              --jq '
                .[]
                | select(.baseRefName == "main")
                | select(.headRefName | startswith("release-please"))
                | .number
              ')

            if [ -n "${RELEASE_PRS}" ]; then

              # Take the first matching Release Please PR.
              PR_NUMBER=$(echo "${RELEASE_PRS}" | head -n 1)

              echo ""
              echo "========================================"
              echo "Release Please PR FOUND"
              echo "PR Number: ${PR_NUMBER}"
              echo "========================================"

              # ------------------------------------------------------
              # Extra verification.
              #
              # Before merging, retrieve complete PR information and
              # verify that it really has the Release Please label.
              # ------------------------------------------------------

              PR_INFO=$(gh pr view "${PR_NUMBER}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json number,title,headRefName,baseRefName,state,labels)

              echo ""
              echo "Release Please PR details:"
              echo "${PR_INFO}"

              IS_VALID=$(echo "${PR_INFO}" | jq -r '
                (
                  .state == "OPEN"
                  and
                  .baseRefName == "main"
                  and
                  (.headRefName | startswith("release-please"))
                  and
                  ([.labels[].name] | any(. == "autorelease: pending"))
                )
              ')

              if [ "${IS_VALID}" != "true" ]; then
                echo ""
                echo "ERROR: PR failed Release Please verification."
                echo "NOTHING WILL BE MERGED."
                exit 1
              fi

              echo ""
              echo "Release Please PR verification successful."

              echo "pr_found=true" >> "${GITHUB_OUTPUT}"
              echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

              exit 0
            fi

            echo "No verified Release Please PR found yet."
            echo "Waiting 5 seconds..."

            sleep 5

            ATTEMPT=$((ATTEMPT + 1))

          done

          # ==========================================================
          # IMPORTANT SAFETY CONDITION
          #
          # If we cannot positively identify a Release Please PR,
          # fail the workflow instead of merging another PR.
          # ==========================================================

          echo ""
          echo "========================================"
          echo "ERROR"
          echo "========================================"
          echo "Could not find a verified Release Please PR."
          echo ""
          echo "NO PR WILL BE MERGED."
          echo ""
          echo "Open PRs currently visible:"
          
          gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --state open \
            --json number,title,headRefName,baseRefName,labels \
            --jq '.[]'

          exit 1

      # ============================================================
      # STEP 5
      # Auto merge ONLY the verified Release Please PR.
      # ============================================================
      - name: Auto Merge Release Please PR
        if: ${{ steps.find_pr.outputs.pr_found == 'true' }}
        env:
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
        run: |
          set -e

          echo "========================================"
          echo "AUTO MERGING RELEASE PLEASE PR"
          echo "========================================"
          echo "PR Number: ${PR_NUMBER}"

          # --------------------------------------------------------
          # Final verification immediately before merge.
          # --------------------------------------------------------

          PR_INFO=$(gh pr view "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json number,title,headRefName,baseRefName,state,labels)

          echo "PR information:"
          echo "${PR_INFO}"

          IS_VALID=$(echo "${PR_INFO}" | jq -r '
            (
              .state == "OPEN"
              and
              .baseRefName == "main"
              and
              (.headRefName | startswith("release-please"))
              and
              ([.labels[].name] | any(. == "autorelease: pending"))
            )
          ')

          if [ "${IS_VALID}" != "true" ]; then
            echo ""
            echo "ERROR: PR is no longer a verified Release Please PR."
            echo "ABORTING MERGE."
            exit 1
          fi

          echo ""
          echo "PR verification passed."
          echo "This PR was created by Release Please."
          echo ""
          echo "Enabling auto-merge..."

          gh pr merge "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --auto \
            --merge

          echo ""
          echo "Auto-merge request submitted."

      # ============================================================
      # STEP 6
      # Wait until ONLY that verified Release Please PR is merged.
      # ============================================================
      - name: Wait for Release Please PR to be merged
        if: ${{ steps.find_pr.outputs.pr_found == 'true' }}
        env:
          PR_NUMBER: ${{ steps.find_pr.outputs.pr_number }}
        run: |
          set -e

          echo "========================================"
          echo "WAITING FOR RELEASE PLEASE PR MERGE"
          echo "========================================"
          echo "PR Number: ${PR_NUMBER}"

          MAX_ATTEMPTS=60
          ATTEMPT=1

          while [ "${ATTEMPT}" -le "${MAX_ATTEMPTS}" ]; do

            PR_STATE=$(gh pr view "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json state \
              --jq '.state')

            echo ""
            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS}"
            echo "PR state: ${PR_STATE}"

            if [ "${PR_STATE}" = "MERGED" ]; then
              echo ""
              echo "========================================"
              echo "Release Please PR MERGED"
              echo "========================================"
              exit 0
            fi

            if [ "${PR_STATE}" = "CLOSED" ]; then
              echo ""
              echo "ERROR: Release Please PR was closed without merging."
              exit 1
            fi

            echo "Waiting 5 seconds..."
            sleep 5

            ATTEMPT=$((ATTEMPT + 1))

          done

          echo ""
          echo "ERROR: Release Please PR was not merged within timeout."
          exit 1

      # ============================================================
      # STEP 7
      # Wait for GitHub to synchronize the merge.
      # ============================================================
      - name: Wait for merged Release Please PR synchronization
        if: ${{ steps.find_pr.outputs.pr_found == 'true' }}
        run: |
          echo "Release Please PR has been merged."
          echo "Waiting 15 seconds for GitHub synchronization..."
          sleep 15

      # ============================================================
      # STEP 8
      # Run Release Please AGAIN.
      #
      # It should now detect that the Release Please PR was merged
      # and create the actual version tag and GitHub Release.
      # ============================================================
      - name: Run Release Please - Create Version and Release
        id: rp_release
        if: ${{ steps.find_pr.outputs.pr_found == 'true' }}
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ env.GH_TOKEN }}
          target-branch: main
          skip-github-pull-request: false
          skip-github-release: false
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # ============================================================
      # STEP 9
      # Debug final release.
      # ============================================================
      - name: Debug Final Release
        if: ${{ steps.find_pr.outputs.pr_found == 'true' }}
        run: |
          echo "========================================"
          echo "FINAL RELEASE"
          echo "========================================"
          echo "releases_created = ${{ steps.rp_release.outputs.releases_created }}"
          echo "paths_released   = ${{ steps.rp_release.outputs.paths_released }}"
          echo "tag_name         = ${{ steps.rp_release.outputs.tag_name }}"
          echo "release_created  = ${{ steps.rp_release.outputs.release_created }}"
          echo "========================================"

      # ============================================================
      # STEP 10
      # Update APP_VERSION and LAST_RELEASE_DATE ONLY when the
      # actual GitHub Release has been created.
      # ============================================================
      - name: Update APP_VERSION and LAST_RELEASE_DATE
        if: ${{ steps.rp_release.outputs.release_created == 'true' }}
        env:
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ steps.rp_release.outputs.tag_name }}
        run: |
          set -e

          if [ -z "${TAG_NAME}" ]; then
            echo "ERROR: TAG_NAME is empty."
            exit 1
          fi

          RUN_DATE="$(date +%d-%m-%Y)"

          echo "========================================"
          echo "UPDATING ENVIRONMENT VARIABLES"
          echo "========================================"
          echo "APP_VERSION       = ${TAG_NAME}"
          echo "LAST_RELEASE_DATE = ${RUN_DATE}"
          echo "========================================"

          for ENV_NAME in dev uat; do

            echo ""
            echo "----------------------------------------"
            echo "Environment: ${ENV_NAME}"
            echo "----------------------------------------"

            # ======================================================
            # APP_VERSION
            # ======================================================

            echo "Updating APP_VERSION..."

            if gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPOSITORY}/environments/${ENV_NAME}/variables/APP_VERSION" \
              -f name="APP_VERSION" \
              -f value="${TAG_NAME}"
            then

              echo "APP_VERSION updated successfully."

            else

              echo "APP_VERSION does not exist."
              echo "Creating APP_VERSION..."

              gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/${REPOSITORY}/environments/${ENV_NAME}/variables" \
                -f name="APP_VERSION" \
                -f value="${TAG_NAME}"

              echo "APP_VERSION created successfully."

            fi

            # ======================================================
            # LAST_RELEASE_DATE
            # ======================================================

            echo "Updating LAST_RELEASE_DATE..."

            if gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPOSITORY}/environments/${ENV_NAME}/variables/LAST_RELEASE_DATE" \
              -f name="LAST_RELEASE_DATE" \
              -f value="${RUN_DATE}"
            then

              echo "LAST_RELEASE_DATE updated successfully."

            else

              echo "LAST_RELEASE_DATE does not exist."
              echo "Creating LAST_RELEASE_DATE..."

              gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/${REPOSITORY}/environments/${ENV_NAME}/variables" \
                -f name="LAST_RELEASE_DATE" \
                -f value="${RUN_DATE}"

              echo "LAST_RELEASE_DATE created successfully."

            fi

          done

          echo ""
          echo "========================================"
          echo "RELEASE PROCESS COMPLETED SUCCESSFULLY"
          echo "========================================"